# Project 2 — Mobile Money Investigations
# Usage:
#   docker compose up -d postgres neo4j          # start databases
#   docker compose run --rm app python check_env.py
#   docker compose run --rm app python capture.py
# For timing (Section 6/7) run ONE database at a time:
#   docker compose stop neo4j   (or postgres)

services:
  postgres:
    image: postgres:17
    container_name: mm_postgres
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: mobile_money
      TZ: Africa/Kigali
      PGTZ: Africa/Kigali
    # Fixed resource settings — record these in 1.1. Adjust to your RAM (see notes).
    command:
      - postgres
      - -c
      - timezone=Africa/Kigali
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=8GB
    shm_size: 2gb
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro          # CSVs from capture.py, read-only for \copy

  neo4j:
    image: neo4j:5-community
    container_name: mm_neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 3G
      NEO4J_db_transaction_timeout: 180s
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4jdata:/data
      - ./import:/import         # typed CSV copies for neo4j-admin import

  app:
    build: .
    working_dir: /work
    environment:
      PGHOST: postgres
      PGUSER: mm
      PGDATABASE: mobile_money
      PGPASSWORD: ${PG_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      TZ: Africa/Kigali
    volumes:
      - .:/work
    profiles: ["tools"]          # only runs when you call `docker compose run app ...`

volumes:
  pgdata:
  neo4jdata:
